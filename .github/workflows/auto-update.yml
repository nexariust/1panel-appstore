name: Auto Update Apps

on:
  schedule:
    # 每天凌晨 1 点（UTC+8 时区为北京时间）运行，UTC 时间为前一天 17:00
    - cron: '0 17 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Check for updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_updates.py

      - name: Check if updates found
        id: check_updates
        run: |
          if [ -f updates.json ] && [ $(jq length updates.json) -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "update_count=$(jq length updates.json)" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "update_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_updates.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(deps): auto update ${{ steps.check_updates.outputs.update_count }} apps

            Auto-generated by GitHub Actions
          branch: auto-update-${{ github.run_number }}
          delete-branch: true
          title: 'chore(deps): auto update ${{ steps.check_updates.outputs.update_count }} apps'
          body: |
            ## 🤖 自动更新

            此 PR 由 GitHub Actions 自动创建，检测到以下应用有新版本：

            ```json
            $(cat updates.json)
            ```

            ### 变更内容
            - 创建了新版本文件夹
            - 更新了 docker-compose.yml 中的镜像标签
            - 复制了配置文件到新版本

            ### 检查清单
            - [ ] 验证新版本的 Docker 镜像是否可用
            - [ ] 检查配置文件是否需要调整
            - [ ] 测试应用是否可以正常启动

            ---

            🕐 更新时间: ${{ github.event.repository.updated_at }}
            📦 检测到 ${{ steps.check_updates.outputs.update_count }} 个更新
          labels: |
            dependencies
            automated
          assignees: ${{ github.actor }}

      - name: Summary
        run: |
          echo "### 🎉 更新检查完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_updates.outputs.has_updates }}" == "true" ]; then
            echo "✅ 发现 ${{ steps.check_updates.outputs.update_count }} 个应用更新" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 更新详情" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat updates.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 所有应用已是最新版本" >> $GITHUB_STEP_SUMMARY
          fi
