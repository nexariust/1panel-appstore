name: Auto Update Apps

on:
  schedule:
    # 每天凌晨 1 点（UTC+8 时区为北京时间）运行，UTC 时间为前一天 17:00
    - cron: '0 17 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Check for updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_updates.py

      - name: Check if updates found
        id: check_updates
        run: |
          if [ -f updates.json ] && [ $(jq length updates.json) -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "update_count=$(jq length updates.json)" >> $GITHUB_OUTPUT

            # 生成更新的应用列表
            apps_list=$(jq -r '.[].app' updates.json | paste -sd ',' -)
            echo "apps_list=$apps_list" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "update_count=0" >> $GITHUB_OUTPUT
            echo "apps_list=" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # 配置 Git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 添加所有更改
          git add apps/

          # 生成提交信息
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          APPS="${{ steps.check_updates.outputs.apps_list }}"

          git commit -m "chore(deps): update ${APPS} at ${TIMESTAMP}"

          # 推送到 dev 分支
          git push origin dev

      - name: Summary
        run: |
          echo "### 🎉 更新检查完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_updates.outputs.has_updates }}" == "true" ]; then
            echo "✅ 发现 ${{ steps.check_updates.outputs.update_count }} 个应用更新" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 📦 更新列表" >> $GITHUB_STEP_SUMMARY
            jq -r '.[] | "- **\(.app)**: \(.old_version) → \(.new_version)"' updates.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ 已自动提交到 dev 分支" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 所有应用已是最新版本" >> $GITHUB_STEP_SUMMARY
          fi
