name: Auto Update Apps

on:
  schedule:
    # 每天凌晨 1 点（UTC+8 时区为北京时间）运行，UTC 时间为前一天 17:00
    - cron: '0 17 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Check for updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_updates.py

      - name: Check if updates found
        id: check_updates
        run: |
          if [ -f updates.json ] && [ $(jq length updates.json) -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "update_count=$(jq length updates.json)" >> $GITHUB_OUTPUT

            # 生成更新的应用列表
            apps_list=$(jq -r '.[].app' updates.json | paste -sd ',' -)
            echo "apps_list=$apps_list" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "update_count=0" >> $GITHUB_OUTPUT
            echo "apps_list=" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create branch and commit
        if: steps.check_updates.outputs.has_updates == 'true'
        id: commit
        run: |
          # 生成分支名
          BRANCH_NAME="auto-update-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # 创建并切换到新分支
          git checkout -b $BRANCH_NAME

          # 添加所有更改
          git add apps/

          # 生成提交信息
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          APPS="${{ steps.check_updates.outputs.apps_list }}"

          git commit -m "chore(deps): update ${APPS} at ${TIMESTAMP}"

          # 推送分支
          git push -u origin $BRANCH_NAME

      - name: Create Pull Request
        if: steps.check_updates.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 生成 PR 正文
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          PR_BODY=$(cat <<EOF
          ## 🤖 自动更新

          此 PR 由 GitHub Actions 自动创建，检测到以下应用有新版本：

          $(jq -r '.[] | "- **\(.app)**: \(.old_version) → \(.new_version)"' updates.json)

          ### 📋 详细信息

          \`\`\`json
          $(cat updates.json)
          \`\`\`

          ### ✅ 变更内容
          - 创建了新版本文件夹
          - 更新了 docker-compose.yml 中的镜像标签
          - 复制了配置文件到新版本

          ### 🔍 检查清单
          - [ ] 验证新版本的 Docker 镜像是否可用
          - [ ] 检查配置文件是否需要调整
          - [ ] 测试应用是否可以正常启动

          ---

          🕐 **更新时间**: ${TIMESTAMP}
          📦 **更新数量**: ${{ steps.check_updates.outputs.update_count }} 个应用
          EOF
          )

          # 创建 PR
          gh pr create \
            --title "chore(deps): update ${{ steps.check_updates.outputs.update_count }} apps at ${TIMESTAMP}" \
            --body "$PR_BODY" \
            --base dev \
            --head ${{ steps.commit.outputs.branch_name }} \
            --label "dependencies,automated"

      - name: Summary
        run: |
          echo "### 🎉 更新检查完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_updates.outputs.has_updates }}" == "true" ]; then
            echo "✅ 发现 ${{ steps.check_updates.outputs.update_count }} 个应用更新" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 更新详情" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat updates.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 所有应用已是最新版本" >> $GITHUB_STEP_SUMMARY
          fi
